name: Compilar y Empaquetar Juegos (Linux y Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libsdl2-image-dev

      - name: Configurar con CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar todos los ejecutables
        run: cmake --build build -j$(nproc)

      - name: Preparar paquete portátil de Linux
        run: |
          mkdir -p paquete_linux
          cp -r build/bin paquete_linux/
          cp -r assets paquete_linux/
          cp games.registry paquete_linux/
          cp JUGAR.sh paquete_linux/
          chmod +x paquete_linux/build/bin/* paquete_linux/JUGAR.sh
          tar -czf DualShow-Linux.tar.gz -C paquete_linux .

      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: DualShow-Linux
          path: DualShow-Linux.tar.gz

  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar con CMake
        run: cmake -S . -B build

      - name: Compilar ejecutables en Release
        run: cmake --build build --config Release

      - name: Preparar paquete portátil de Windows
        shell: bash
        run: |
          mkdir -p paquete_windows
          cp -r build/bin paquete_windows/
          cp -r assets paquete_windows/
          cp games.registry paquete_windows/
          cp JUGAR.bat paquete_windows/
          # Script directo para iniciar la version ya compilada sin requerir git ni cmake
          cat << 'EOF' > paquete_windows/JUGAR_PORTABLE.bat
          @echo off
          cd /d "%~dp0"
          start "" "bin\menu.exe"
          EOF
          7z a DualShow-Windows.zip ./paquete_windows/*

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: DualShow-Windows
          path: DualShow-Windows.zip

  release:
    name: Publicar Release Automática
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4

      - name: Actualizar o Crear Release 'latest'
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: Dual Show - Ultima Version Compilada
          body: |
            ## Dual Show - Paquetes portables listos para jugar
            Esta release se compila automáticamente con cada cambio en la rama principal.

            - **Windows**: Descargar `DualShow-Windows.zip`, descomprimir y ejecutar `JUGAR_PORTABLE.bat` (no necesita instalar nada).
            - **Linux (Ubuntu)**: Descargar `DualShow-Linux.tar.gz`, descomprimir y ejecutar `./JUGAR.sh`.
          files: |
            DualShow-Linux/DualShow-Linux.tar.gz
            DualShow-Windows/DualShow-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
